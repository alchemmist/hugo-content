{{- $fonts := resources.Get "hugo-content/fonts.css" | resources.ExecuteAsTemplate "hugo-content/fonts.css" . -}}
{{- $styles := slice $fonts (resources.Get "hugo-content/content.css") (resources.Get "hugo-content/syntax.css") | resources.Concat "hugo-content/content.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}" />
