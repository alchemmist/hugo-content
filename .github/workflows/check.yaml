name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.167.0'
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o /tmp/hugo_checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          mv /tmp/hugo.tar.gz "/tmp/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd /tmp
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz$" hugo_checksums.txt | sha256sum --check
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo install hugo /usr/local/bin/hugo
      - run: make vendor
      - run: git diff --exit-code -- static/hugo-content/lib licenses/javascript-notices.txt
      - run: make check
      - name: Check the downloaded Go module
        env:
          MODULE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tests/package.py "$MODULE_REVISION"
