baseURL = 'http://localhost:1315/'
locale = 'en-us'
title = 'Hugo Content example'

disableKinds = ['taxonomy', 'term']

[module.hugoVersion]
min = '0.167.0'

[module]
[[module.imports]]
path = 'github.com/alchemmist/hugo-content'

[[module.mounts]]
source = 'content'
target = 'content'
[[module.mounts]]
source = 'layouts'
target = 'layouts'
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
source = 'static'
target = 'static'

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$']]
inline = [['$', '$']]

[params]
math = true


[markup.highlight]
style = "github"
noClasses = false
